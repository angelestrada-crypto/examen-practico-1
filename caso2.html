<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horario Semestral</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    h2 {
      margin-bottom: 15px;
    }
    table {
      border-collapse: collapse;
      width: auto;
    }
    th, td {
      border: 1px solid #999;
      padding: 10px 18px;
      text-align: center;
    }
    .matematicas {
      background-color: red;
      color: white;
      font-weight: bold;
    }
    .lengua {
      background-color: saddlebrown;
      color: white;
      font-weight: bold;
    }
    .informatica {
      background-color: yellow;
      color: #333;
      font-weight: bold;
    }
    .efisica {
      background-color: pink;
      color: #333;
      font-weight: bold;
    }
    .recreo {
      background-color: green;
      color: white;
      font-weight: bold;
    }
    th {
      background-color: #f0f0f0;
    }
    td:first-child {
      text-align: left;
      font-weight: bold;
      background-color: #fff;
    }
  </style>
</head>
<body>
  <h2>HORARIO SEMESTRAL</h2>
  <table>
    <thead>
      <tr>
        <th>Horas</th>
        <th>Lunes</th>
        <th>Martes</th>
        <th>Miércoles</th>
        <th>Jueves</th>
        <th>Viernes</th>
      </tr>
    </thead>
    <tbody>
      <!-- 8:00-9:00 -->
      <tr>
        <td>8:00-9:00</td>
        <td rowspan="2" class="matematicas">Matemáticas</td>
        <td class="lengua">Lengua</td>
        <td>Música</td>
        <td></td>
        <td rowspan="2" class="matematicas">Matemáticas</td>
      </tr>
      <!-- 9:00-10:00 -->
      <tr>
        <td>9:00-10:00</td>
        <td>Inglés</td>
        <td>Inglés</td>
        <td class="efisica">E.Fisica</td>
      </tr>
      <!-- 10:00-10:30 Recreo -->
      <tr>
        <td>10:00-10:30</td>
        <td colspan="5" class="recreo">Recreo</td>
      </tr>
      <!-- 10:30-11:30 -->
      <tr>
        <td>10:30-11:30</td>
        <td class="efisica">E.Fisica</td>
        <td>Valenciano</td>
        <td rowspan="2" class="lengua">Lengua</td>
        <td class="informatica">Informática</td>
        <td>Inglés</td>
      </tr>
      <!-- 12:30-13:30 -->
      <tr>
        <td>12:30-13:30</td>
        <td>Música</td>
        <td class="efisica">E.Fisica</td>
        <td rowspan="2" class="matematicas">Matemáticas</td>
        <td class="informatica">Informática</td>
      </tr>
      <!-- 13:30-14:30 -->
      <tr>
        <td>13:30-14:30</td>
        <td></td>
        <td class="informatica">Informática</td>
        <td></td>
        <td></td>
      </tr>
    </tbody>
  </table>
</body>
</html>
